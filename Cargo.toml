[workspace]
resolver = "2"
members = ["crates/printfold-core", "src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
printfold-core = { path = "crates/printfold-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
