[package]
name = "printfold-core"
description = "Layout, text flow, project format and PDF engine for PrintFold"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
uuid.workspace = true
serde_with = "3"
self_cell = "1"
pulldown-cmark = { version = "0.13", default-features = false }
rustybuzz = "0.20"
fontdb = { version = "0.24", default-features = false, features = ["std", "fs"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
miniz_oxide = "0.8"
krilla = { version = "0.8", default-features = false, features = ["raster-images", "simple-text"] }
# Same decoders krilla uses, to validate images before embedding (krilla
# decodes lazily, so one corrupt image would otherwise fail the whole PDF).
png = "0.18"
zune-jpeg = "0.5"
gif = "0.14"
image-webp = "0.2"

[dev-dependencies]
