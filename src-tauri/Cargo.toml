[package]
name = "printfold"
description = "PrintFold — signature-based booklets from markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "printfold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
printfold-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
uuid.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Share sheet (iPadOS) / sharing picker (macOS). Pinned: pre-release.
tauri-plugin-sharekit = "=0.4.0-rc.7"
log = "0.4"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# Clipboard reading ("New file from clipboard"); iPadOS uses WebKit's API.
arboard = "3"
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
trash = "5"
